# Dujiao-Next — production Docker Compose kit
# App + Redis by default. Optional Caddy reverse proxy (automatic HTTPS)
# behind the "proxy" profile. Copy .env.example to .env and adjust first.
# Docs: https://github.com/dujiao-next/community-projects (scripts/docker-compose-production-kit)

services:
  app:
    image: ${IMAGE:-dujiaonext/dujiao-next}:${TAG:-latest}
    container_name: dujiao-next
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      # Localhost by default: put Caddy (proxy profile) or your own reverse
      # proxy in front. Set BIND_ADDR=0.0.0.0 in .env to expose directly.
      - "${BIND_ADDR:-127.0.0.1}:${APP_PORT:-8080}:8080"
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./data/db:/app/db
      - ./data/uploads:/app/uploads
      - ./data/logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: dujiao-next-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: dujiao-next-caddy
    restart: unless-stopped
    profiles: ["proxy"]
    depends_on:
      - app
    environment:
      # NOTE: no ${VAR:?error} here — Compose interpolates the whole file
      # even for profile-disabled services, so a hard error would break
      # every command for users who never enable the proxy. Set a real
      # SITE_DOMAIN in .env before starting the proxy profile.
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
